[project]
name = "lifeflow"
version = "0.1.0"
description = "LifeFlow: a dependency-aware life manager that answers 'what should I do next?'"
entry-point = "main"
kind = "web-app"
jac-version = "==0.37.23"

[dependencies]
[dependencies.npm]
react = "^19.2.0"
react-dom = "^19.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.7.0"
typescript = "^5.3.3"
"@types/react" = "^19.2.0"
"@types/react-dom" = "^19.2.0"

[dev-dependencies]
watchdog = ">=3.0.0"

# JacHammer's proxy decompresses gzip but keeps the Content-Encoding header, so
# browsers fail with ERR_CONTENT_DECODING_FAILED on responses > 1 KB. Let the
# platform handle compression instead.
[serve.compression]
enabled = false

[byllm.model]
default_model = "gemini/gemini-2.5-flash"

[placement.pins]
"components.util" = "client"     # browser-only helpers (Date, toLocaleString)
"components.util.*" = "client"

[client]
